version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: polymarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polymarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polymarket}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polymarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: polymarket-backend
    restart: unless-stopped
    # T40 (deployment coherence audit): `.env.example` tells an operator to
    # "copy this file to `.env`", but of the 56 `Settings` fields only the
    # four DERIVED-FROM-TOPOLOGY ones below were ever forwarded into this
    # container -- there was no `env_file:` and the bind mount
    # (`./backend:/app`) does not reach the repo-root `.env`. Everything
    # else, including the Kalshi credentials cross-venue arbitrage needs,
    # the four risk limits, and KILL_SWITCH_PATH, silently fell back to
    # compiled-in defaults with no error. `env_file:` is the self-maintaining
    # fix: it forwards whatever `.env` holds, including settings added after
    # this comment was written, so it cannot rot the way the enumerated list
    # did. `required: false` because a fresh clone has no `.env` yet (compose
    # would otherwise fail to start rather than fall back to `Settings`
    # defaults, which is the existing, desired behaviour for a missing file).
    env_file:
      - path: .env
        required: false
    # These four are DERIVED FROM COMPOSE TOPOLOGY, not plain pass-throughs:
    # they are composed from (or hardcoded to) this compose file's own
    # service hostnames/credentials and must keep overriding whatever an
    # operator has in `.env` for a local non-Docker run (e.g. `redis://
    # localhost:6379`) or a non-Docker Postgres user/password. Explicit
    # `environment:` entries always win over `env_file:` for the same key,
    # which is what keeps these pinned. Every other setting (SECRET_KEY,
    # DEBUG, LOG_LEVEL, TRADING_MODE, the Polymarket/Kalshi credentials, the
    # risk limits, etc.) is a plain pass-through and now comes from
    # `env_file:` above instead of being re-declared here.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-polymarket}:${POSTGRES_PASSWORD:-polymarket}@postgres:5432/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: polymarket-celery-worker
    restart: unless-stopped
    # T40: same gap, same fix, same classification as `backend` above --
    # this process runs the identical `app.config.Settings` and needs the
    # same pass-throughs (notably the Kalshi credentials and the risk
    # limits) to behave the way `.env` says it should.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-polymarket}:${POSTGRES_PASSWORD:-polymarket}@postgres:5432/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # T40 (defense in depth): pinned to one task slot for the same reason
    # `docker/backend/Dockerfile` pins uvicorn to `--workers 1` -- the
    # money-safety invariant is "at most one process ever routes an order"
    # (`app/execution/router.py`'s `OrderRouter` docstring: its `asyncio.Lock`
    # submit-gate is scoped to ONE event loop in ONE process, and a second
    # process sharing the database can breach a risk cap or lose a filled
    # position to a concurrent-update overwrite). Celery's default prefork
    # pool spawns `os.cpu_count()` child processes with no flag at all, and
    # none of the four tasks currently registered here call
    # `OrderRouter.submit()` -- so this is not fixing a live bug, it is
    # closing the gap before a future execution task inherits unbounded
    # concurrency by default. `--concurrency=1` means exactly one task runs
    # at a time no matter which pool implementation is in effect, so the
    # four discovery/reconcile beats queue instead of overlapping when their
    # schedules coincide -- a queuing delay on I/O-bound, harmless-in-parallel
    # work, not a correctness cost. Raise this only once the router has the
    # database-enforced concurrency control its own docstring says it is
    # still missing (an optimistic-concurrency version column on
    # `positions`), not before.
    command: celery -A app.tasks worker --loglevel=info --concurrency=1

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: polymarket-celery-beat
    restart: unless-stopped
    # T40: same gap and fix as `backend`/`celery-worker` above.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-polymarket}:${POSTGRES_PASSWORD:-polymarket}@postgres:5432/${POSTGRES_DB:-polymarket}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    command: celery -A app.tasks beat --loglevel=info

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: development
    container_name: polymarket-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: polymarket-network
